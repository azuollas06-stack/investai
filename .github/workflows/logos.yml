name: Logotipai

# Atsisiunčia aktyvų logotipus į assets/logos/. Paleidžiama rankiniu būdu,
# pakeitus logotipų skriptą arba aktyvų sąrašą (nauji aktyvai gauna logotipą).
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Atsisiųsti iš naujo visus"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - tools/fetch_logos.py
      - data/assets.json
      - .github/workflows/logos.yml

permissions:
  contents: write

concurrency:
  group: logos
  cancel-in-progress: false

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance>=0.2.50" pillow requests
      - run: python tools/fetch_logos.py ${{ inputs.force && '--force' || '' }}
      - name: Įrašyti pakeitimus
        run: |
          git config user.name "investai-bot"
          git config user.email "investai-bot@users.noreply.github.com"
          git add assets/logos data/logos.json
          if git diff --cached --quiet; then echo "Nėra pakeitimų"; exit 0; fi
          git commit -m "Logotipai atnaujinti"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
