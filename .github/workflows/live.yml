name: Kainos biržų darbo metu

# Kas ~15 min biržų darbo metu atnaujina tik kainą ir dienos pokytį (data/live.json, ~15 KB).
# Duomenys uždelsti ~15 min (Yahoo Finance); svetainėje taip ir pažymėta.
on:
  schedule:
    - cron: "*/15 7-21 * * 1-5"   # UTC: ~9–24 val. Vilniaus laiku (Europos ir JAV biržos)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/live.yml
      - run: pip install "yfinance>=0.2.50"
      - run: python tools/fetch_prices.py --live
      - name: Įrašyti pakeitimus
        run: |
          git config user.name "investai-bot"
          git config user.email "investai-bot@users.noreply.github.com"
          git add data/live.json
          if git diff --cached --quiet; then echo "Nėra pakeitimų"; exit 0; fi
          git commit -m "Kainos $(date -u +%H:%M) UTC"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
