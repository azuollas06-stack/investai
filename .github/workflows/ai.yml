name: AI serveris

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/ai.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ce18265d90a54347cdf321594ee75966
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patikrinti raktus
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Nėra CLOUDFLARE_API_TOKEN paslapties"; exit 1; fi
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | python3 -c "import sys,json; d=json.load(sys.stdin); print('Cloudflare raktas:', d['result']['status'])" || \
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Cloudflare raktas:', d['result']['status'])"

      - name: workers.dev adresas
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          SUB=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('result') or {}).get('subdomain') or '')")
          if [ -z "$SUB" ]; then
            for name in investai investai-lt investai-ai investai-$RANDOM; do
              R=$(curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"subdomain\":\"$name\"}" "$API")
              if echo "$R" | grep -q '"success":true'; then SUB=$name; break; fi
              echo "$R"
            done
          fi
          echo "workers.dev subdomenas: $SUB"

      - name: Įkelti serverį
        working-directory: worker
        run: npx --yes wrangler@4 deploy 2>&1 | tee ../deploy.log

      - name: Perduoti AI raktus serveriui
        working-directory: worker
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then printf '%s' "$OPENAI_API_KEY" | npx --yes wrangler@4 secret put OPENAI_API_KEY; else echo "OPENAI_API_KEY nėra"; fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@4 secret put ANTHROPIC_API_KEY; else echo "ANTHROPIC_API_KEY nėra"; fi

      - name: Išsaugoti adresą svetainei
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "::error::Neradome serverio adreso"; exit 1; fi
          echo "Serveris: $URL"
          curl -sS "$URL/" || true
          printf '{"url": "%s"}\n' "$URL" > data/ai.json
          git config user.name "investai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ai.json
          if git diff --cached --quiet; then echo "Adresas nepasikeitė"; exit 0; fi
          git commit -m "AI serverio adresas"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

      - name: Patikrinti, ar asistentas atsako
        run: |
          URL=$(python3 -c "import json;print(json.load(open('data/ai.json'))['url'])")
          sleep 5
          curl -sS -m 60 -X POST "$URL/chat" -H "Origin: https://azuollas06-stack.github.io" -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"Kas yra ETF? Atsakyk dviem sakiniais."}]}' -D - ; echo
          echo "---"
          curl -sS -m 60 -X POST "$URL/chat" -H "Origin: https://azuollas06-stack.github.io" -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"Kodėl Nvidia akcija šiandien pajudėjo? Atsakyk trumpai su šaltiniais."}]}' ; echo
          echo "--- naujienos"
          curl -sS -m 60 "$URL/news?q=Nvidia%20stock" -H "Origin: https://azuollas06-stack.github.io" | head -c 1500; echo

      - name: Patikrinti pranešimus ir nuotraukų atpažinimą
        run: |
          URL=$(python3 -c "import json;print(json.load(open('data/ai.json'))['url'])")
          curl -sS "$URL/push/key" -H "Origin: https://azuollas06-stack.github.io"; echo
          pip install -q pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import base64, io, json
          im = Image.new("RGB", (720, 420), "white"); d = ImageDraw.Draw(im)
          f = ImageFont.load_default(size=28)
          rows = [("Portfolio", "4 772,40 €"), ("IonQ  IONQ", "512,40 €   -8,6 %"), ("NVIDIA  NVDA", "1 830,00 €   +34,5 %"), ("Vanguard FTSE All-World", "2 430,00 €   +9,6 %")]
          for i, (a, b) in enumerate(rows): d.text((30, 30 + i * 90), a, fill="black", font=f); d.text((400, 30 + i * 90), b, fill="black", font=f)
          buf = io.BytesIO(); im.save(buf, "JPEG", quality=85)
          json.dump({"images": ["data:image/jpeg;base64," + base64.b64encode(buf.getvalue()).decode()]}, open("/tmp/parse.json", "w"))
          PY
          curl -sS -m 90 -X POST "$URL/parse" -H "Origin: https://azuollas06-stack.github.io" -H "Content-Type: application/json" --data @/tmp/parse.json; echo
