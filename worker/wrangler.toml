# InvestAI AI serveris (Cloudflare Worker). Įkeliamas automatiškai: .github/workflows/ai.yml
name = "investai-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "ce18265d90a54347cdf321594ee75966"
workers_dev = true

[vars]
# Tiekėją ir modelį galima pakeisti čia: PROVIDER = "openai" | "anthropic"
PROVIDER = "openai"
MODEL = "gpt-6-luna"
ALLOWED_ORIGINS = "https://azuollas06-stack.github.io,https://investai*.vercel.app,http://localhost:8765"
# Kiek klausimų per dieną vienam lankytojui ir visiems kartu (biudžeto apsauga)
PER_USER_DAY = "25"
GLOBAL_DAY = "600"
# Premium nariams – daugiau klausimų. Čia tik rakto maišos kodas (patį raktą žino tik atrakinę Premium).
PREMIUM_MULT = "2"
# Atsiliepimų peržiūros rakto maišos kodas (patį raktą žino tik savininkas)
ADMIN_HASH = "9348909a49b729d8adcbc997a2a6abc6fbdb535af35762b3656e74cb59ef9567"
PREMIUM_AI_HASH = "b0deb5e24109eab3fbdc18111abd0130483828966d7bacbb225ff01c773c7797"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

[[durable_objects.bindings]]
name = "PUSH"
class_name = "Push"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Push"]

# Kainų įspėjimų tikrinimas kas 15 min. darbo dienomis (UTC 7–21)
[triggers]
crons = ["*/15 7-21 * * 1-5", "0 17 * * 0", "0 6 * * 1-5"]
